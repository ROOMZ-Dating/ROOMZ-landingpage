<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roomz — Your event, their love story.</title>
    <meta
      name="description"
      content="Roomz turns any event into a place where single guests meet — and gives organizers the tool to make it happen. Add a private Singles Room to your wedding, party, or venue night."
    />
    <!-- Open Graph. Crawlers don't resolve relative paths, so the image and URL
         are absolute against the production domain. og:* uses property=,
         twitter:* uses name= — they are not interchangeable. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://roomzdating.com/" />
    <meta property="og:title" content="ROOMZ - Shared context. Real connections." />
    <meta
      property="og:description"
      content="Real connections, real vibes, no endless swiping."
    />
    <meta property="og:image" content="https://roomzdating.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The ROOMZ logo over a rooftop party at sunset — Shared context. Real connections."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ROOMZ - Shared context. Real connections." />
    <meta
      name="twitter:description"
      content="Real connections, real vibes, no endless swiping."
    />
    <meta name="twitter:image" content="https://roomzdating.com/og-image.jpg" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#6B21A8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Palanquin:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Silktide consent manager. Vendor snippet, pasted as issued. The init
         call relies on the loader above having already run, so neither script
         can be given async/defer. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" id="silktide-consent-manager-css" href="https://cdn.jsdelivr.net/gh/silktide/consent-manager@v2.0.1/silktide-consent-manager.css" integrity="sha384-EdMq+R+YOnsbelo08wPenoTlnxbAyxI11NMIxzugx/qAsbh64KcOkqxYqq6pfvO/" crossorigin="anonymous">
    <style id="silktide-consent-manager-overrides">
#stcm-wrapper {
  --boxShadow: -5px 5px 10px 0px #00000012, 0px 0px 50px 0px #0000001a;
  --fontFamily: 'Inter', Helvetica Neue, Segoe UI, Arial, sans-serif;
  --primaryColor: #6b21a8;
  --backgroundColor: #FAF9F6;
  --textColor: #1C1C1C;
  --backdropBackgroundColor: #00000033;
  --backdropBackgroundBlur: 0px;
  --iconColor: #6B21A8;
  --iconBackgroundColor: #FAF9F6;
}
    </style>
    <script src="https://cdn.jsdelivr.net/gh/silktide/consent-manager@v2.0.1/silktide-consent-manager.js" integrity="sha384-5Pt34uiIbCsvfiiZXoLi4HRf/YBXjr9c8e+gYeVo9smUaInNHYVtc8NZ8wUnXJIq" crossorigin="anonymous"></script>

    <!-- Mixpanel library, loaded but not initialized until consent is granted.
         Safe to defer: the consent manager finds no document.body from <head>
         and so builds itself on DOMContentLoaded, which fires after every
         deferred script has run. mixpanel is therefore always defined by the
         time onAccept can call loadMixpanel(). -->
    <script src="https://cdn.mxpnl.com/libs/mixpanel-2-latest.min.js" defer></script>

    <script>
function loadMixpanel() {
  if (window.mixpanelLoaded) return;
  window.mixpanelLoaded = true;
  mixpanel.init("cc5182e7abf24d1e90ffa7f22b33d327", { track_pageview: true });
}

window.silktideConsentManager.init({
  backdrop: {
    show: true
  },
  icon: {
    position: "bottomRight"
  },
  prompt: {
    position: "bottomRight"
  },
  consentTypes: [
    {
      id: "essential",
      label: "Essential",
      description: "<p>These cookies are necessary for the website to function properly and cannot be switched off. They help with things like logging in and setting your privacy preferences.</p>",
      required: true
    },
    {
      id: "analytics",
      label: "Analytics",
      description: "<p>These cookies help us understand how visitors use Roomz so we can improve the product.</p>",
      defaultValue: true,
      onAccept: function() {
        loadMixpanel();
      }
    },
    {
      id: "marketing",
      label: "Marketing",
      description: "<p>These cookies are used by us and our advertising partners to show you relevant ads on this site and elsewhere, and to measure how those campaigns perform.</p>",
      defaultValue: false
    }
  ],
  text: {
    prompt: {
      description: "<p>We use cookies to enhance your experience and understand how you use Roomz. See our <a href=\"/privacy\">Privacy Policy</a>.</p>",
      acceptAllButtonText: "Accept all",
      acceptAllButtonAccessibleLabel: "Accept all cookies",
      rejectNonEssentialButtonText: "Reject non-essential",
      rejectNonEssentialButtonAccessibleLabel: "Reject all non-essential cookies",
      preferencesButtonText: "Preferences",
      preferencesButtonAccessibleLabel: "Toggle preferences"
    },
    preferences: {
      title: "Customize your cookie preferences",
      description: "<p>We respect your right to privacy. You can choose not to allow some types of cookies. Your cookie preferences will apply across our website.</p>",
      saveButtonText: "Save and close",
      saveButtonAccessibleLabel: "Save your cookie preferences",
      creditLinkText: "Get this banner for free",
      creditLinkAccessibleLabel: "Get this banner for free"
    }
  }
});

// If the visitor already consented to analytics on a previous visit, load Mixpanel immediately
document.addEventListener('DOMContentLoaded', function() {
  var manager = window.silktideConsentManager.getInstance();
  if (manager && manager.getConsentChoice('analytics')) {
    loadMixpanel();
  }
});
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Enable accessibility widget. Vendor snippet, pasted as issued and kept
         last in <body> per their install instructions. -->
    <script src="https://cdn.enable.co.il/licenses/enable-L2431092mvnf16ir-0124-83451/init.js"></script>
  </body>
</html>
